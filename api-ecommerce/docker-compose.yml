services:
  mysql1:
    image: mysql:latest
    container_name: ecommerce-sql
    environment:
      MYSQL_ROOT_PASSWORD: super-secret-123@
      MYSQL_DATABASE: ecommerce-db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - review_network

volumes:
  mysql_data:

networks:
  review_network:
    driver: bridge